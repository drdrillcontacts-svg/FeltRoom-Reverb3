
name: Build FeltRoom VST3 (Windows)

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-2022

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure with CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release VST3
        run: cmake --build build --config Release --target FeltRoom_VST3 --parallel 2

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Filter "*.vst3" -Recurse |
            Where-Object { $_.PSIsContainer } |
            Select-Object -First 1

          if (-not $plugin) {
            throw "VST3 bundle not found after build"
          }

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path $plugin.FullName -Destination dist -Recurse
          Compress-Archive -Path "dist/*" -DestinationPath "FeltRoom-Windows-VST3.zip" -Force

      - name: Upload VST3 download
        uses: actions/upload-artifact@v4
        with:
          name: FeltRoom-Windows-VST3
          path: FeltRoom-Windows-VST3.zip
          if-no-files-found: error
